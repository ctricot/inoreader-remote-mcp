[project]
name = "inoreader-remote-mcp"
version = "0.1.0"
description = "Remote MCP server for Inoreader: read, mark and manage your feeds from Claude."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.14.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
inoreader-remote-mcp = "inoreader_remote_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
