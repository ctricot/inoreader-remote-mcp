name: CI & image

# The gate runs on every push and pull request; the image is only published from `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (ruff · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen`: the lock is authoritative. A `pyproject.toml` that moved without
      # `uv.lock` must fail here, not resolve to something the image will not carry.
      - run: uv sync --frozen

      - run: uv run ruff check

      - run: uv run ruff format --check

      # Zero network: Inoreader is mocked with respx.
      - run: uv run pytest -q

  image:
    name: Image → GHCR
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `GITHUB_TOKEN` is enough to push to this repository's GHCR package.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what deployments pull; the commit tag allows rolling back without
          # rebuilding.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
