name: CI

# The gate runs on every push and pull request. No image is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (ruff · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen`: the lock is authoritative. A `pyproject.toml` that moved without
      # `uv.lock` must fail here, not resolve to something the image will not carry.
      - run: uv sync --frozen

      - run: uv run ruff check

      - run: uv run ruff format --check

      # Zero network: Inoreader is mocked with respx.
      - run: uv run pytest -q
